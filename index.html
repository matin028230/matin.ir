<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Matin</title>

    <!-- فونت فارسی Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: rgb(19, 0, 102);
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
        }

        h1 {
            color: yellow;
            background-color: black;
            text-align: center;
            font-size: 150px;
            border: 20px solid yellow;
            margin: 0;
        }

        p {
            font-size: 60px;
            text-align: center;
            border: 10px solid black;
            background-color: rgb(255, 255, 255);
            margin: 20px;
        }

        .box {
            width: 954px;
            height: 1000px;
            background-color: rgb(40, 189, 127);
            border: 10px solid black;
            margin: auto;
        }
        .bok {
            width: 954px;
            height: 1000px;
            background-color: rgb(84, 107, 97);
            border: 12px solid black;
            margin: auto;
        }

        img {
            width: 500px;
            height: 200px;
            display: block;
            margin: -1400px auto 0 auto;
            border: 10px solid black;
        }
    </style>
</head>

<body>

    <h1>Iran</h1>

    <p>به نام خدا</p>

    <div class="box" style="color: rgb(0, 0, 0); font-size: 45px; direction: rtl; text-align: right;"> هخامنشیان</div>
    <div class="bok" style="color: rgb(255, 255, 255); font-size: 45px; direction: rtl; text-align: right;"> salam</div>
    <img src="Standard_of_Cyrus_the_Great.svg.png" alt="flag">

</body>
</html>
